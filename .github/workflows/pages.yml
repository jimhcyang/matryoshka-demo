name: Validate And Publish Source-Bound Static Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI Dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium --only-shell
      - name: Compatible Existing Transport Tests
        run: python -m pytest -q runtime/tests/runtime_browser_test.py runtime/tests/runtime_fragment_test.py runtime/tests/runtime_external_test.py
      - name: New Manifest And Authorization Tests
        run: python -m unittest discover -s release-tools/ci -p 'test_*.py'
      - name: Whole Asset And Native Reference Integrity
        run: python release-tools/ci/validate_manifest.py --site site --scratch "$RUNNER_TEMP/manifest-check" --output "$RUNNER_TEMP/manifest-check.json"
      - name: Managed Browser On The Actual Static Site
        run: python release-tools/ci/browser_smoke.py --site site --output "$RUNNER_TEMP/browser-check"
      - name: Fresh Lead Authorization And Upload Budget
        run: python release-tools/ci/validate_manifest.py --site site --scratch "$RUNNER_TEMP/authorization-check" --output "$RUNNER_TEMP/authorization.json" --inventory-only --mode publish --approval-ref release/approval_ref.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Only The Validated Uploaded Artifact
        id: deployment
        uses: actions/deploy-pages@v4
